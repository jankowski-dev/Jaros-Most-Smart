<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ярик.Уроки — уроки с Байтом</title>
    <meta name="theme-color" content="#FFF8EE">
    <meta name="description" content="Обучающая платформа для Ярика: математика, чтение и тест на слух">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ярик">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preload" href="fonts/montserrat-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="overflow-x-hidden">
    <a class="skip-link" href="#view-root">Перейти к содержимому</a>

    <div id="app" class="app-shell">
        <div id="main-nav"></div>
        <main id="view-root" class="w-full flex-1" tabindex="-1"></main>
    </div>

    <div id="toast-root" class="toast-stack" aria-live="polite"></div>
    <div id="overlay-root"></div>

    <!-- Баннер обновления: ID обязательны для update-notifier.js -->
    <div id="update-banner" class="items-center gap-4" role="status">
        <span id="update-text">Появилась новая версия</span>
        <div id="update-progress-container" class="hidden">
            <div id="update-progress-bar"></div>
        </div>
        <button id="update-btn" class="btn btn-primary btn-sm" type="button">Обновить</button>
    </div>

    <noscript>
        <div class="mx-auto max-w-xl p-6 text-center">
            <h1 class="text-title">Нужен JavaScript</h1>
            <p class="muted mt-2">Включи JavaScript, чтобы Байт смог показать уроки.</p>
        </div>
    </noscript>

    <script src="config.js"></script>
    <script src="speech-service.js"></script>
    <script type="module" src="js/main.js"></script>
    <script src="update-notifier.js"></script>
</body>
</html>
